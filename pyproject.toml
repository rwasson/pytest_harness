# pyproject.toml

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest_harness"
readme = "README.md"
version = "0.2.0"
authors = [{ name = "R. Wasson", email = "r.wasson.dev@gmail.com" }]

description = "Easy-to-use pytest workflow orchestrator with isolated test-file execution, combined coverage, dashboard summaries, and optional per-test-file logs."

license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.13"

keywords = [
    "pytest",
    "testing",
    "coverage",
    "test runner",
    "python",
    "IDE"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Framework :: Pytest",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]


# --- Runtime dependencies -----------------------------------------------------
dependencies = [
    "logduo>=0.2.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-json-report",
    "pytest-rerunfailures>=16,<17",
    "pytest-timeout",
    "pytest-random-order",
]

[project.urls]
Homepage = "https://github.com/rwasson/pytest_harness"
Repository = "https://github.com/rwasson/pytest_harness"
Issues = "https://github.com/rwasson/pytest_harness/issues"

# --- Optional dependencies ----------------------------------------------------
[project.optional-dependencies]
dev = [
  "build",
  "twine>=7.0.0",
  "ruff>=0.16.2",
  "mypy>=1.10,<3",
  "vulture",
  "pre-commit>=4.6.1",
]


# --- setuptools ---------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_harness = ["py.typed"]

# --- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
exclude = ["deprecated"]
strict = true
warn_unreachable = true
ignore_missing_imports = false


[[tool.mypy.overrides]]
module = [
    "cerberus",
    "cerberus.*",
]
ignore_missing_imports = true

# --- Ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["build", "deprecated"]     # exclude certain directories

[tool.ruff.lint]
select = [
    "E",
    "F",
    "ANN",
    "UP",
    "PLR",
    "B",      # flake8-bugbear: likely bugs / dubious constructs
    # "SIM",                # simplifiable code does not always make code easier to read
    "RUF",    # Ruff-specific correctness checks
]

ignore = [
    "ANN401",                  # any-type
    # "PLR0912",        # too-many-branches
]

[tool.ruff.lint.per-file-ignores]
"src/pytest_harness/__init__.py" = ["F401"]

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.isort]
# To sort imports, in Terminal:
# run ruff check src --select I --fix
combine-as-imports = true
force-single-line = false  # if false, allows: from typing import Any, Callable
order-by-type = false  # false preserves expected order
